[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcompat-ci"
version = "0.1.0"
description = "Behavioural compatibility testing for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "GitPython>=3.1.43",
    "packaging>=24.0",
    "PyYAML>=6.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115.0,<1",
    "httpx>=0.27.0,<1",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.8",
]

[project.scripts]
agentcompat = "agentcompat.cli:app"

[tool.setuptools.packages.find]
include = ["agentcompat*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
